  </defs>
  <!-- duong bien san -->
  <rect x="30" y="25" width="340" height="210" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <line x1="200" y1="25" x2="200" y2="235" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <circle cx="200" cy="130" r="38" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <circle cx="200" cy="130" r="4" fill="#ffffff" opacity="0.85"/>
  <!-- vong cam hai ben -->
  <rect x="30" y="80" width="45" height="100" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <rect x="325" y="80" width="45" height="100" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <text x="200" y="132" text-anchor="middle" dominant-baseline="middle"
