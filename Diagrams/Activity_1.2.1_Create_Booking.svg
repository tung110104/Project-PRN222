<svg viewBox="0 -44 1240 664" width="1240" height="664" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Activity diagram - Field Booking Processing (Create Booking by Customer)</title>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#000}
    .ttl{font-size:17px;font-weight:bold;font-style:italic}
    .hd{font-size:13px;font-weight:bold}
    .t{font-size:12px}
    .g{font-size:11px;fill:#333}
    .act{fill:#b3e0f2;stroke:#2e7fac;stroke-width:1}
    .dec{fill:#b3e0f2;stroke:#2e7fac;stroke-width:1}
    .arr{stroke:#000;stroke-width:1;fill:none}
    .lane{fill:none;stroke:#444;stroke-width:1}
    .hdr{fill:#f7f7f7;stroke:#444;stroke-width:1}
  </style>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5L9 5L0 8.5z" fill="#000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#ffffff"/>

  <!-- Swimlane frame -->
  <rect class="lane" x="1" y="1" width="1238" height="618"/>
  <line class="lane" x1="310" y1="1" x2="310" y2="619"/>
  <line class="lane" x1="620" y1="1" x2="620" y2="619"/>
  <line class="lane" x1="930" y1="1" x2="930" y2="619"/>

  <!-- Lane headers -->
  <rect class="hdr" x="1" y="1" width="309" height="30"/>
  <rect class="hdr" x="310" y="1" width="310" height="30"/>
  <rect class="hdr" x="620" y="1" width="310" height="30"/>
  <rect class="hdr" x="930" y="1" width="309" height="30"/>
  <text class="hd" x="155" y="21" text-anchor="middle">Customer</text>
  <text class="hd" x="465" y="21" text-anchor="middle">Booking System</text>
  <text class="hd" x="775" y="21" text-anchor="middle">Field Owner (Staff)</text>
  <text class="hd" x="1085" y="21" text-anchor="middle">Payment System</text>

  <!-- Connectors -->
  <line class="arr" x1="155" y1="59" x2="155" y2="68" marker-end="url(#af)"/>
  <line class="arr" x1="155" y1="112" x2="155" y2="128" marker-end="url(#af)"/>
  <line class="arr" x1="225" y1="152" x2="391" y2="152" marker-end="url(#af)"/>
  <line class="arr" x1="465" y1="172" x2="465" y2="192" marker-end="url(#af)"/>
  <line class="arr" x1="449" y1="210" x2="229" y2="210" marker-end="url(#af)"/>
  <line class="arr" x1="155" y1="230" x2="155" y2="247" marker-end="url(#af)"/>
  <line class="arr" x1="465" y1="224" x2="465" y2="240" marker-end="url(#af)"/>
  <line class="arr" x1="465" y1="284" x2="465" y2="304" marker-end="url(#af)"/>
  <polyline class="arr" points="449,322 185,322 185,236" marker-end="url(#af)"/>
  <line class="arr" x1="465" y1="336" x2="465" y2="352" marker-end="url(#af)"/>
  <line class="arr" x1="465" y1="396" x2="465" y2="412" marker-end="url(#af)"/>
  <line class="arr" x1="395" y1="436" x2="229" y2="436" marker-end="url(#af)"/>
  <line class="arr" x1="155" y1="456" x2="155" y2="472" marker-end="url(#af)"/>
  <line class="arr" x1="171" y1="490" x2="1011" y2="490" marker-end="url(#af)"/>
  <polyline class="arr" points="155,504 155,580 701,580" marker-end="url(#af)"/>
  <line class="arr" x1="845" y1="580" x2="862" y2="580" marker-end="url(#af)"/>
  <polyline class="arr" points="1085,510 1085,545 539,545" marker-end="url(#af)"/>
  <line class="arr" x1="395" y1="545" x2="378" y2="545" marker-end="url(#af)"/>

  <!-- Guards / questions -->
  <text class="g" x="340" y="204" text-anchor="middle">[No]</text>
  <text class="g" x="487" y="214">Valid?</text>
  <text class="g" x="472" y="238">[Yes]</text>
  <text class="g" x="340" y="316" text-anchor="middle">[No]</text>
  <text class="g" x="487" y="326">Slots free?</text>
  <text class="g" x="472" y="350">[Yes]</text>
  <text class="g" x="131" y="494" text-anchor="end">Pay now?</text>
  <text class="g" x="185" y="484">[Yes]</text>
  <text class="g" x="163" y="530">[No]</text>

  <!-- Initial / final nodes -->
  <circle cx="155" cy="52" r="7" fill="#000"/>
  <circle cx="155" cy="258" r="9" fill="none" stroke="#000" stroke-width="1.5"/>
  <circle cx="155" cy="258" r="4.5" fill="#000"/>
  <circle cx="873" cy="580" r="9" fill="none" stroke="#000" stroke-width="1.5"/>
  <circle cx="873" cy="580" r="4.5" fill="#000"/>
  <circle cx="367" cy="545" r="9" fill="none" stroke="#000" stroke-width="1.5"/>
  <circle cx="367" cy="545" r="4.5" fill="#000"/>

  <!-- Decisions -->
  <polygon class="dec" points="465,196 481,210 465,224 449,210"/>
  <polygon class="dec" points="465,308 481,322 465,336 449,322"/>
  <polygon class="dec" points="155,476 171,490 155,504 139,490"/>

  <!-- Activities: Customer -->
  <rect class="act" x="85" y="72" width="140" height="40" rx="14"/>
  <text class="t" x="155" y="89" text-anchor="middle">Select field, date</text>
  <text class="t" x="155" y="104" text-anchor="middle">&amp; time slots</text>

  <rect class="act" x="85" y="132" width="140" height="40" rx="14"/>
  <text class="t" x="155" y="149" text-anchor="middle">Enter promo code,</text>
  <text class="t" x="155" y="164" text-anchor="middle">submit request</text>

  <rect class="act" x="85" y="190" width="140" height="40" rx="14"/>
  <text class="t" x="155" y="207" text-anchor="middle">Receive error</text>
  <text class="t" x="155" y="222" text-anchor="middle">message</text>

  <rect class="act" x="85" y="416" width="140" height="40" rx="14"/>
  <text class="t" x="155" y="433" text-anchor="middle">Select payment</text>
  <text class="t" x="155" y="448" text-anchor="middle">method</text>

  <!-- Activities: Booking System -->
  <rect class="act" x="395" y="132" width="140" height="40" rx="14"/>
  <text class="t" x="465" y="149" text-anchor="middle">Check date, slots,</text>
  <text class="t" x="465" y="164" text-anchor="middle">field status</text>

  <rect class="act" x="395" y="244" width="140" height="40" rx="14"/>
  <text class="t" x="465" y="261" text-anchor="middle">Calculate price &amp;</text>
  <text class="t" x="465" y="276" text-anchor="middle">apply promo</text>

  <rect class="act" x="395" y="356" width="140" height="40" rx="14"/>
  <text class="t" x="465" y="373" text-anchor="middle">Create Pending</text>
  <text class="t" x="465" y="388" text-anchor="middle">booking, promo -1</text>

  <rect class="act" x="395" y="416" width="140" height="40" rx="14"/>
  <text class="t" x="465" y="433" text-anchor="middle">Send confirmation</text>
  <text class="t" x="465" y="448" text-anchor="middle">email</text>

  <rect class="act" x="395" y="525" width="140" height="40" rx="14"/>
  <text class="t" x="465" y="542" text-anchor="middle">Record Paid, set</text>
  <text class="t" x="465" y="557" text-anchor="middle">booking Confirmed</text>

  <!-- Activities: Field Owner -->
  <rect class="act" x="705" y="560" width="140" height="40" rx="14"/>
  <text class="t" x="775" y="585" text-anchor="middle">Confirm booking</text>

  <!-- Activities: Payment System -->
  <rect class="act" x="1015" y="470" width="140" height="40" rx="14"/>
  <text class="t" x="1085" y="487" text-anchor="middle">Process payment</text>
  <text class="t" x="1085" y="502" text-anchor="middle">(simulated)</text>
</svg>
